<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>アプリを更新中...</title>
  <style>
    body {
      font-family: -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: #EFECE7; color: #3D3A36;
      text-align: center; padding: 20px;
    }
    h1 { font-size: 20px; margin-bottom: 12px; }
    p  { font-size: 14px; color: #8A847C; margin: 4px 0; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #D4CFC8;
      border-top-color: #6BA8A8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>アプリを更新しています</h1>
  <p>古いキャッシュを削除しています...</p>
  <p id="status"></p>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        // すべてのService Workerを登録解除
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
          status.textContent = `Service Worker ${regs.length} 件を削除しました`;
        }
        // キャッシュをすべて削除
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (e) {
        status.textContent = '処理中...';
      }
      // 少し待ってからトップページへ
      setTimeout(() => {
        window.location.href = './?nocache=' + Date.now();
      }, 1500);
    })();
  </script>
</body>
</html>
